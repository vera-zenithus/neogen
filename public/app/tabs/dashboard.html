<div class="dashboard-grid">
    <div class="card">
        <h3 data-i18n="dashboard.financial_status">📊 재무현황</h3>
        <div class="financial-summary">
            <div class="summary-item">
                <span data-i18n="dashboard.total_assets">총 자산</span>
                <span id="totalAssets">₩ 0</span>
            </div>
            <div class="summary-item">
                <span data-i18n="dashboard.total_liabilities">총 부채</span>
                <span id="totalLiabilities">₩ 0</span>
            </div>
            <div class="summary-item">
                <span data-i18n="dashboard.net_assets">자본</span>
                <span id="totalEquity">₩ 0</span>
            </div>
            <div class="summary-item">
                <span data-i18n="dashboard.net_income">당기순이익</span>
                <span id="netIncome">₩ 0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 data-i18n="dashboard.recent_transactions">📈 최근 거래</h3>
        <div id="recentTransactions">
            <p class="no-data" data-i18n="dashboard.no_transactions">아직 거래가 없습니다.</p>
        </div>
    </div>
</div>
