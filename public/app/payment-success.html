<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 - NeoGen</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-dark, #0a0a0f);
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .success-card {
            background: var(--bg-card, #13131a);
            border: 1px solid rgba(0,255,180,0.3);
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            max-width: 440px;
            width: 90%;
        }
        .success-icon { font-size: 3.5rem; margin-bottom: 16px; }
        h1 { color: #00ffb4; font-size: 1.6rem; margin: 0 0 12px; }
        p  { color: #aaa; font-size: 0.95rem; line-height: 1.6; margin: 0 0 28px; }
        .home-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00ffb4, #00b4ff);
            color: #000;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1rem;
        }
        #loading {
            color: #aaa;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="success-card" id="successCard" style="display:none">
        <div class="success-icon">🎉</div>
        <h1>결제 완료!</h1>
        <p>Pro 플랜이 활성화됐어요!<br>이제 네오 AI를 제한 없이 사용할 수 있어요.</p>
        <a href="/app" class="home-btn">네오젠 시작하기</a>
    </div>
    <div id="loading">
        <p>결제 준비 중...</p>
    </div>
    <script>
        const params = new URLSearchParams(location.search);
        const ptxn = params.get('_ptxn');

        if (ptxn) {
            // _ptxn 있으면 Paddle 결제창 열기
            Paddle.Setup({ seller: 307750 });
            Paddle.Checkout.open({
                transactionId: ptxn,
                settings: {
                    displayMode: 'overlay',
                    theme: 'dark',
                    locale: 'ko'
                }
            });
        } else {
            // 결제 완료 후 돌아온 경우
            document.getElementById('loading').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        }
    </script>
</body>
</html>
